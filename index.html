<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>SPIRA SEARCH</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header>
    <h1>Spira Search</h1>
  </header>
  <main>
    <section>
      <label for="search-input">Search for Creature</label>
      <input id="search-input" required>
      <button id="search-button">Search</button>
    </section>
    <section>
      <table>
        <tr>
          <th>Base</th>
          <th>Stats</th>
        </tr>
        <tr>
          <td><label for="creature-name">Creature Name</label></td>
          <td>
            <p id="creature-name"></p>
          </td>
        </tr>
        <tr>
          <td><label for="creature-id">Creature ID</label></td>
          <td>
            <p id="creature-id"></p>
          </td>
        </tr>
        <tr>
          <td><label for="weight">Weight</label></td>
          <td>
            <p id="weight"></p>
          </td>
        </tr>
        <tr>
          <td><label for="height">Height</label></td>
          <td>
            <p id="height"></p>
          </td>
        </tr>
        <tr>
          <td><label for="types">Types</label></td>
          <td>
            <p id="types"></p>
          </td>
        </tr>
        <tr>
          <td><label for="hp">HP</label></td>
          <td>
            <p id="hp"></p>
          </td>
        </tr>
        <tr>
          <td><label for="attack">Attack</label></td>
          <td>
            <p id="attack"></p>
          </td>
        </tr>
        <tr>
          <td><label for="defense">Defense</label></td>
          <td>
            <p id="defense"></p>
          </td>
        </tr>
        <tr>
          <td><label for="special-attack"> Special Attack</label></td>
          <td>
            <p id="special-attack"></p>
          </td>
        </tr>
            <tr>
    <td><label for="special-defense">Special Defense</label></td>
    <td><p id="special-defense"></p></td>
  </tr>
      <tr>
    <td><label for="speed">Speed</label></td>
    <td><p id="speed"></p></td>
  </tr>
      </table>
    </section>
  </main>
  <footer></footer>
  <script src="script.js"></script>
</body>

</html>
